[project]
name = "gannet"
version = "3.5.4"
description = "Python toolkit for automated data processing and quantification of edited 1H magnetic resonance spectroscopy (MRS) data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Mark Mikkelsen" },
    { name = "Richard A. E. Edden" },
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "nibabel>=5.2.0",
    "pydicom>=2.4.0",
    "pandas>=2.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
gannet = "gannet.pipeline.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gannet"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
